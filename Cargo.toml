[package]
name = "ihni"
version = "0.1.0"
edition = "2024"
description = "A standalone Rust WWXD hard-cut detector, independent of VapourSynth"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
ihni-core = { path = "crates/ihni-core" }
ihni-media = { path = "crates/ihni-media" }
# The keyframe writer publishes its output through a same-directory temporary
# file. This was already a development dependency at the same version.
tempfile = "3.23"

[workspace]
members = ["crates/*"]

# The oracle is a development-only tool that regenerates the pinned golden
# vectors, and it declares its own workspace so it never compiles C as part of a
# normal build. Listing it here records that it is deliberately outside this
# workspace rather than merely unmatched by the member glob.
exclude = ["oracle/wwxd-golden"]

# Every member is built and tested by default. A root package plus a member glob
# would otherwise make a bare `cargo test` cover only the root package, which
# would silently stop running the core and media suites.
default-members = ["crates/*", "."]
