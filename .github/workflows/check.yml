name: checks

on:
  push:
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      # Syntax and formatting only. Compilation, tests, and every
      # FFmpeg-dependent gate live in the release workflow, so a routine push
      # cannot fail on a flaky tool install.
      - name: Check formatting
        shell: bash
        run: cargo fmt --all -- --check

  # The detector's fidelity to the pinned WWXD decision core is checked, not
  # asserted: this job rebuilds the C oracle from the pinned reference and
  # regenerates golden.json, then fails if the committed vectors differ. A clean
  # diff proves the committed expectations equal the live pinned C (reference
  # commit a5870862), so the default cargo test can read them offline.
  #
  # It runs on Linux with gcc rather than the Windows MSVC path because the pinned
  # detection.c uses C99 compound literals that MSVC may reject, and because a
  # Linux-gcc match is itself a cross-platform fidelity signal. The oracle is a
  # separate cargo workspace, so this never builds the FFmpeg-linked crates and
  # never touches FFmpeg.
  wwxd-golden-parity:
    name: WWXD golden parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      # gcc ships with ubuntu-latest; the install is verified rather than assumed.
      - name: Check the C compiler
        shell: bash
        run: |
          if ! command -v gcc >/dev/null 2>&1; then
            echo "Required tool 'gcc' is not on PATH." >&2
            exit 1
          fi
          gcc --version | head -n 1

      - name: Clone the pinned WWXD reference
        shell: bash
        run: |
          git clone https://github.com/dubhatervapoursynth/vapoursynth-wwxd.git target/wwxd-reference
          git -C target/wwxd-reference checkout --detach a5870862fd85138b5e4822a076377b96592c9cd2
          # Fail early with a clear message if the reference is not the pinned one.
          test "$(git -C target/wwxd-reference rev-parse HEAD)" = a5870862fd85138b5e4822a076377b96592c9cd2

      - name: Regenerate the golden vectors from the reference
        shell: bash
        run: cargo run --manifest-path oracle/wwxd-golden/Cargo.toml

      - name: Verify the committed vectors match the reference
        shell: bash
        run: |
          if ! git diff --exit-code -- tests/fixtures/detect/golden.json; then
            echo "The committed golden.json differs from the pinned WWXD reference." >&2
            echo "The port is not byte-exact, or a fixture changed without regeneration." >&2
            git diff -- tests/fixtures/detect/golden.json >&2
            exit 1
          fi
